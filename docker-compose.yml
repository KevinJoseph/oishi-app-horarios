services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-horario2-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 2002
      CORS_ORIGIN: http://localhost:2001
    ports:
      - "2002:2002"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: app-horario2-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "2001:80"
